# Render injects PORT; Spring needs SERVER_PORT or explicit mapping
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.sql.init.mode=never

spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.com.soulsync=INFO
logging.level.org.springframework.security=WARN

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

brevo.api.key=${BREVO_API_KEY}

# Photos are stored on disk; mount a persistent volume here
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads}
# Trust X-Forwarded-* from the reverse proxy so upload URLs use https
server.forward-headers-strategy=framework

app.mail.from=${APP_MAIL_FROM}
app.mail.from-name=${APP_MAIL_FROM_NAME}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Razorpay (Dashboard → Account & Settings → API Keys); blank disables checkout
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
